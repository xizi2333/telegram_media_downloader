# 1. 基础认证配置 (必填)；从 https://my.telegram.org/apps 注册并获取
api_id: xx
api_hash: "xx"
# Telegram 机器人 Token (可选)，如需通过 Telegram Bot 远程发送下载指令或查看进度，向 @BotFather 申请获取；不需要请留空
bot_token: ''

# 2. 目标频道/群组配置 (必填)
chat:
- chat_id: xx                 # 目标 ID。私密频道以 -100 开头；个人收藏夹填 'me'；公开频道也可填 '@channel_username'
  last_read_message_id: 0             # 上次读取的消息 ID。首次填 0 表示从头下载，后续运行会自动更新记录
    # 针对该频道的下载过滤器（可选）。支持条件: media_file_size (大小), media_duration (秒), message_date (时间) 等
  download_filter: message_date >= 2026-09-16 00:00:00 and message_date <= 2026-09-16 23:59:59
    # download_filter: "media_file_size >= 10MB and media_duration >= 30"
    # 可选：下载完成后自动转发/上传到指定的 Telegram 频道或群组 ID 
    # upload_telegram_chat_id: -1009876543210

  #   支持同时配置多个频道
  # - chat_id: -1001122334455
  #   last_read_message_id: 0
  #   download_filter: ""

# 3. 媒体类型与文件格式过滤 (核心配置)
# 允许下载的媒体类型列表（按需保留）：选项: video(视频), document(文档/无损大文件), photo(图片), audio(音频音乐), voice(语音消息), video_note(圆形小视频), animation(GIF动图)
media_types:
- video
  # - document                              
  # - photo                                 
  # - audio                                 
  # - voice                                 
  # - video_note                            
  # - animation                             

# 细分文件格式后缀过滤（设为 - all 表示下载该类型下全部格式；也可指定具体后缀列表）
file_formats:
  video:
  - all                                   # 也可以写具体后缀列表，如: [mp4, mkv, mov, avi, webm]
  document:
  - all                                   # 若开启了 document 但只想下载视频，可指定: [mp4, mkv, flv]
  audio:
  - all                                   # 音频格式，如: [mp3, flac, wav, aac]

# 是否丢弃没有音轨的无声视频
drop_no_audio_video: true

# 是否将消息附带的文字标题/说明caption保存为同名 .txt 文件
enable_download_txt: false

# 4. 下载保存路径与文件命名规则
# 本地下载根目录
save_path: "./downloads"

# 子文件夹层级结构（可选变量，按列表顺序逐级创建文件夹）
file_path_prefix:
- chat_title                              # 频道或群组名称, 若无法获取则为 chat_id
- media_datetime                          # media_datetime - 消息发布时间（遵循下方 date_format 格式）
  # - media_type                          # media_type     - 媒体类型 (video, photo, document 等)

# 日期格式 (配合 media_datetime 使用，遵循 Python strftime 规则)
date_format: '%Y_%m_%d'                   # 生成类似: 2024_03_15

# 文件名前缀规则（可选变量，按顺序拼接到原文件名前）
file_name_prefix:
- message_id                              # 消息 ID
- file_name                               # 原始文件名（若为空则自动补齐）
- caption                                 # 消息文本标题

# 文件名前缀的拼接分隔符
file_name_prefix_split: ' - '

# 5. 网络代理设置
proxy:
  scheme: http                            # 协议类型: socks5 / socks4 / http
  hostname: 127.0.0.1                     # 代理工具的本地监听 IP
  port:                                   # 代理端口 (根据你的代理软件如 Clash/v2ray 实际端口填写)
  # 若代理无需账号密码，请保持注释；若需要认证，取消注释并填入：
  # username: "your_proxy_username"
  # password: "your_proxy_password"

# 6. 下载性能与并发控制
# 同时下载的最大任务数（建议 2~5，过高容易触发 Telegram 官方的 FloodWait 限速）
max_download_task: 3

# 底层并发传输分块数（默认为 max_download_task * 5，也可手动指定）
max_concurrent_transmissions: 15

# 连接 Telegram 服务的初始超时时间（秒）
start_timeout: 60

# 下载分片等请求超时时间（秒）
request_timeout: 120

# 异常退出时是否自动重启程序（默认 false）
restart_program: false

# 7. Web 管理面板与安全性配置
# Web 控制台服务监听地址（本地访问填 127.0.0.1，如需在局域网或远程访问填 0.0.0.0）
web_host: 127.0.0.1

# Web 控制台访问端口（浏览器访问 http://127.0.0.1:5000）
web_port: 5000

# Web 控制台登录访问密码（留空则不需要密码直接访问）
web_login_secret: ''

# 是否在 Web 界面中隐藏真实文件名
hide_file_name: false

# 是否开启 Web 调试模式
debug_web: false

# 8. 通用与权限配置
# 界面与日志语言，可选: ZH (中文), EN (英文), RU (俄语), UA (乌克兰语)
language: ZH

# 日志输出等级，可选: DEBUG, INFO, WARNING, ERROR
log_level: INFO

# 允许使用 Telegram Bot 命令交互的用户白名单，填 'me' 代表当前登录账号自己；也可填电报用户数字 ID 或 '@username'
allowed_user_ids:
- me

# 限制机器人每分钟最大转发次数（防止被限流，默认 33，通常无需更改）
forward_limit: 33

# 自动转发至 Telegram 频道成功后，是否删除本地下载的临时文件
after_upload_telegram_delete: true

# 9. 广告过滤与文本清洗 (可选)
# 包含以下关键词的消息将被直接过滤忽略（不下载）
filter_advertisement_list: []
  # - "关注频道"
  # - "博彩"
  # - "广告推广"

# 下载或转发时自动将以下敏感词替换为空白（清除广告字样）
replace_advertisement_list: []
  # - "本频道唯一网址: https://t.me/xxx"
  # - "广告词"

# 10. 云盘自动转存 (可选)
upload_drive:
  enable_upload_file: false               # 是否在本地下载完成后自动转存到网盘
  upload_adapter: rclone                  # 网盘适配器类型: rclone 或 aligo (阿里云盘)
  rclone_path: rclone                     # 系统中 rclone 可执行文件路径 (已加 PATH 可直接写 rclone)
  remote_dir: gdrive:/telegram            # 云盘目标路径 (格式为: [rclone配置名]:[路径])
  before_upload_file_zip: false           # 上传到网盘前是否先压缩成 zip
  after_upload_file_delete: false         # 上传网盘成功后是否删除本地的下载文件
group_add_advertisement: {}
